<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MBTI 王权：人格之骰 (Reigns of Persona)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #050608;
      --gold-primary: #d4af37;
      --gold-light: #fef08a;
      --gold-dark: #8c6d1f;
    }
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: var(--bg-dark);
      color: #f1f5f9;
      font-family: 'Noto Serif SC', serif;
      overflow: hidden;
      margin: 0;
      padding: 0;
      height: 100vh;
      height: 100dvh;
    }
    .font-cinzel { font-family: 'Cinzel', serif; }

    /* Ember WebGL Canvas */
    #ember-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    /* Film Grain */
    .grain-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      opacity: 0.18;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    /* 3D Perspective Stage */
    .stage-container {
      perspective: 1200px;
      transform-style: preserve-3d;
      position: relative;
      z-index: 10;
    }

    /* Tarot Card */
    .tarot-card {
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 0.2s ease;
      will-change: transform, box-shadow;
      border-radius: 20px;
      background: linear-gradient(165deg, rgba(24, 21, 34, 0.96) 0%, rgba(10, 8, 16, 0.98) 100%);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9), 
                  0 0 0 1px rgba(212, 175, 55, 0.4), 
                  inset 0 0 30px rgba(0, 0, 0, 0.8);
    }

    /* Holographic / Liquid Foil Glint Layer */
    .card-foil {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      pointer-events: none;
      background: radial-gradient(circle at var(--foil-x, 50%) var(--foil-y, 50%), 
                  rgba(254, 240, 138, 0.25) 0%, 
                  rgba(212, 175, 55, 0.1) 35%, 
                  rgba(0, 0, 0, 0) 70%);
      mix-blend-mode: color-dodge;
      z-index: 12;
      opacity: 0.85;
    }

    /* Card Border Glow Frame */
    .card-border-ornament {
      position: absolute;
      inset: 6px;
      border-radius: 14px;
      border: 1px solid rgba(212, 175, 55, 0.35);
      pointer-events: none;
      box-shadow: inset 0 0 12px rgba(212, 175, 55, 0.1);
      z-index: 10;
    }

    .card-corner {
      position: absolute;
      width: 12px;
      height: 12px;
      border-color: #d4af37;
      pointer-events: none;
      z-index: 11;
    }
    .card-corner-tl { top: 10px; left: 10px; border-top: 2px solid; border-left: 2px solid; }
    .card-corner-tr { top: 10px; right: 10px; border-top: 2px solid; border-right: 2px solid; }
    .card-corner-bl { bottom: 10px; left: 10px; border-bottom: 2px solid; border-left: 2px solid; }
    .card-corner-br { bottom: 10px; right: 10px; border-bottom: 2px solid; border-right: 2px solid; }

    /* Faction Meter Pillars */
    .meter-capsule {
      position: relative;
      background: radial-gradient(circle, #1a162b 0%, #0c0a14 100%);
      border: 1.5px solid rgba(212, 175, 55, 0.4);
      box-shadow: 0 4px 15px rgba(0,0,0,0.6), inset 0 2px 4px rgba(0,0,0,0.8);
    }
    .meter-fluid {
      transition: height 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Faction Resonance Ray */
    .resonance-ray {
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 0px;
      background: linear-gradient(to bottom, #fcd34d, transparent);
      filter: drop-shadow(0 0 6px #f59e0b);
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
    }
    .resonance-ray.active {
      height: 28px;
      opacity: 1;
    }

    /* Decision Choice Stamps with Glow */
    .choice-stamp {
      position: absolute;
      top: 24px;
      padding: 6px 14px;
      border: 2.5px solid;
      border-radius: 10px;
      font-family: 'Cinzel', 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 0.12em;
      pointer-events: none;
      z-index: 30;
      opacity: 0;
      backdrop-filter: blur(8px);
      transition: transform 0.1s ease, opacity 0.1s ease;
    }
    .stamp-left {
      right: 16px;
      transform: rotate(14deg) scale(0.9);
      color: #f87171;
      border-color: #ef4444;
      background: rgba(40, 10, 15, 0.88);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
    }
    .stamp-right {
      left: 16px;
      transform: rotate(-14deg) scale(0.9);
      color: #34d399;
      border-color: #10b981;
      background: rgba(6, 35, 25, 0.88);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
    }

    /* Alchemical Ring Rotation */
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .alchemy-spin {
      animation: spinSlow 30s linear infinite;
    }
    .alchemy-spin-reverse {
      animation: spinSlow 40s linear infinite reverse;
    }
  </style>
</head>

  <!-- ==================== SCRIPT ==================== -->
  <script>
    /* Ember Particles */
    const canvas = document.getElementById('ember-canvas');
    const ctx = canvas.getContext('2d');
    let width, height, particles = [];

    function resizeCanvas() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * width;
        this.y = height + Math.random() * 40;
        this.size = Math.random() * 2 + 0.8;
        this.speedY = Math.random() * 0.7 + 0.3;
        this.speedX = (Math.random() - 0.5) * 0.4;
        this.opacity = Math.random() * 0.6 + 0.2;
        this.color = Math.random() > 0.4 ? 'rgba(212, 175, 55,' : 'rgba(168, 85, 247,';
        this.life = 0;
        this.maxLife = Math.random() * 300 + 200;
      }
      update() {
        this.y -= this.speedY;
        this.x += this.speedX + Math.sin(this.life * 0.02) * 0.3;
        this.life++;
        if (this.y < -10 || this.life > this.maxLife) this.reset();
      }
      draw() {
        const curOp = this.opacity * (1 - this.life / this.maxLife);
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = `${this.color}${curOp})`;
        ctx.shadowBlur = 6;
        ctx.shadowColor = '#d4af37';
        ctx.fill();
      }
    }

    for (let i = 0; i < 40; i++) {
      const p = new Particle();
      p.y = Math.random() * height;
      particles.push(p);
    }

    function animateParticles() {
      ctx.clearRect(0, 0, width, height);
      for (let p of particles) { p.update(); p.draw(); }
      requestAnimationFrame(animateParticles);

    function playTone(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'swipe') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(280, now);
        osc.frequency.exponentialRampToValueAtTime(140, now + 0.12);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.13);
      } else if (type === 'decision') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(380, now);
        osc.frequency.exponentialRampToValueAtTime(760, now + 0.25);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.26);
      } else if (type === 'victory') {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.type = 'sine';
          o.frequency.setValueAtTime(freq, now + i * 0.1);
          g.gain.setValueAtTime(0.18, now + i * 0.1);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.7);
          o.start(now + i * 0.1);
          o.stop(now + i * 0.1 + 0.75);
        });
      }
    }

    /* State & Logic */
    let currentIndex = 0;
    let scores = { EI: 50, SN: 50, TF: 50, JP: 50 };
    
    const activeCard = document.getElementById('active-card');
    const cardAvatar = document.getElementById('card-avatar');
    const cardSpeaker = document.getElementById('card-speaker');
    const cardText = document.getElementById('card-text');
    const turnCounter = document.getElementById('turn-counter');
    const choicePreviewBox = document.getElementById('choice-preview');
    const previewText = document.getElementById('preview-text');
    const stampLeft = document.getElementById('stamp-left');
    const stampRight = document.getElementById('stamp-right');

    const btnLeft = document.getElementById('btn-swipe-left');
    const btnRight = document.getElementById('btn-swipe-right');
    const btnTextLeft = document.getElementById('btn-text-left');
    const btnTextRight = document.getElementById('btn-text-right');

    const meterEI = document.getElementById('meter-fluid-ei');
    const meterSN = document.getElementById('meter-fluid-sn');
    const meterTF = document.getElementById('meter-fluid-tf');
    const meterJP = document.getElementById('meter-fluid-jp');

    const indEI = document.getElementById('ind-ei');
    const indSN = document.getElementById('ind-sn');
    const indTF = document.getElementById('ind-tf');
    const indJP = document.getElementById('ind-jp');

    const rayEI = document.getElementById('ray-ei');
    const raySN = document.getElementById('ray-sn');
    const rayTF = document.getElementById('ray-tf');
    const rayJP = document.getElementById('ray-jp');

    function renderCard() {
      if (currentIndex >= DECISIONS.length) {
        showResult();
        return;
      }
      const item = DECISIONS[currentIndex];
      cardSpeaker.textContent = item.speaker.toUpperCase();
      cardAvatar.innerHTML = item.avatar;
      cardText.textContent = item.text;
      turnCounter.textContent = `${currentIndex + 1}/${DECISIONS.length}`;

      btnTextLeft.textContent = item.left.stamp;
      btnTextRight.textContent = item.right.stamp;

      stampLeft.textContent = item.left.stamp;
      stampRight.textContent = item.right.stamp;

      activeCard.style.transform = `translate3d(0, 0, 0) rotate(0deg)`;
      activeCard.style.opacity = '1';
      choicePreviewBox.style.opacity = '0';
      stampLeft.style.opacity = '0';
      stampRight.style.opacity = '0';
      hideIndicators();
    }

    function hideIndicators() {
      [indEI, indSN, indTF, indJP].forEach(ind => ind.classList.add('opacity-0'));
      [rayEI, raySN, rayTF, rayJP].forEach(ray => ray.classList.remove('active'));
    }

    function showIndicators(effects) {
      hideIndicators();
      if (!effects) return;
      if ('EI' in effects) { indEI.classList.remove('opacity-0'); rayEI.classList.add('active'); }
      if ('SN' in effects) { indSN.classList.remove('opacity-0'); raySN.classList.add('active'); }
      if ('TF' in effects) { indTF.classList.remove('opacity-0'); rayTF.classList.add('active'); }
      if ('JP' in effects) { indJP.classList.remove('opacity-0'); rayJP.classList.add('active'); }
    }

    function updateMeters() {
      meterEI.style.height = `${scores.EI}%`;
      meterSN.style.height = `${scores.SN}%`;
      meterTF.style.height = `${scores.TF}%`;
      meterJP.style.height = `${scores.JP}%`;
    }

    function applyDecision(direction) {
      playTone('decision');
      const item = DECISIONS[currentIndex];
      const outcome = direction === 'left' ? item.left : item.right;
      
      for (let k in outcome.effects) {
        scores[k] = Math.max(5, Math.min(95, scores[k] + outcome.effects[k]));
      }
      updateMeters();
      
      activeCard.style.transition = 'transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.35s';
      const flyX = direction === 'left' ? -500 : 500;
      const flyRot = direction === 'left' ? -25 : 25;
      activeCard.style.transform = `translate3d(${flyX}px, 40px, 0) rotate(${flyRot}deg)`;
      activeCard.style.opacity = '0';

      currentIndex++;
      setTimeout(() => {
        activeCard.style.transition = 'none';
        renderCard();
      }, 350);
    }

    /* 3D Tilt & Foil */
    const foil = document.getElementById('card-foil');
    activeCard.addEventListener('mousemove', (e) => {
      const rect = activeCard.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const tiltX = ((y / rect.height) - 0.5) * -16;
      const tiltY = ((x / rect.width) - 0.5) * 16;
      activeCard.style.transform = `rotateX(${tiltX}deg) rotateY(${tiltY}deg) translate3d(0, 0, 10px)`;
      foil.style.setProperty('--foil-x', `${(x / rect.width) * 100}%`);
      foil.style.setProperty('--foil-y', `${(y / rect.height) * 100}%`);
    });

    activeCard.addEventListener('mouseleave', () => {
      activeCard.style.transform = `rotateX(0deg) rotateY(0deg) translate3d(0, 0, 0)`;
      foil.style.setProperty('--foil-x', `50%`);
      foil.style.setProperty('--foil-y', `50%`);
    });

    /* Touch Drag */
    let startX = 0, startY = 0, isDragging = false;

    function handleDragStart(x, y) {
      startX = x;
      startY = y;
      isDragging = true;
      activeCard.style.transition = 'none';
    }

    function handleDragMove(x, y) {
      if (!isDragging) return;
      const deltaX = x - startX;
      const deltaY = y - startY;
      const rot = deltaX * 0.08;
      activeCard.style.transform = `translate3d(${deltaX}px, ${deltaY * 0.4}px, 20px) rotate(${rot}deg) rotateY(${deltaX * 0.04}deg)`;

      const rect = activeCard.getBoundingClientRect();
      foil.style.setProperty('--foil-x', `${50 + (deltaX / rect.width) * 30}%`);
      foil.style.setProperty('--foil-y', `${50 + (deltaY / rect.height) * 30}%`);

      const item = DECISIONS[currentIndex];
      if (!item) return;

      if (deltaX < -30) {
        stampLeft.style.opacity = Math.min(1, (Math.abs(deltaX) - 30) / 60);
        stampRight.style.opacity = '0';
        choicePreviewBox.style.opacity = '1';
        previewText.textContent = item.left.hint;
        showIndicators(item.left.effects);
      } else if (deltaX > 30) {
        stampRight.style.opacity = Math.min(1, (deltaX - 30) / 60);
        stampLeft.style.opacity = '0';
        choicePreviewBox.style.opacity = '1';
        previewText.textContent = item.right.hint;
        showIndicators(item.right.effects);
      } else {
        stampLeft.style.opacity = '0';
        stampRight.style.opacity = '0';
        choicePreviewBox.style.opacity = '0';
        hideIndicators();
      }
    }

    function handleDragEnd(x) {
      if (!isDragging) return;
      isDragging = false;
      const deltaX = x - startX;
      if (deltaX < -90) {
        applyDecision('left');
      } else if (deltaX > 90) {
        applyDecision('right');
      } else {
        playTone('swipe');
        activeCard.style.transition = 'transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s';
        activeCard.style.transform = `translate3d(0, 0, 0) rotate(0deg)`;
        stampLeft.style.opacity = '0';
        stampRight.style.opacity = '0';
        choicePreviewBox.style.opacity = '0';
        hideIndicators();
      }
    }

    activeCard.addEventListener('mousedown', (e) => handleDragStart(e.clientX, e.clientY));
    window.addEventListener('mousemove', (e) => handleDragMove(e.clientX, e.clientY));
    window.addEventListener('mouseup', (e) => handleDragEnd(e.clientX));

    activeCard.addEventListener('touchstart', (e) => {
      const touch = e.touches[0];
      handleDragStart(touch.clientX, touch.clientY);
    }, { passive: true });
    
    window.addEventListener('touchmove', (e) => {
      const touch = e.touches[0];
      handleDragMove(touch.clientX, touch.clientY);
    }, { passive: false });
    
    window.addEventListener('touchend', (e) => {
      const touch = e.changedTouches[0];
      handleDragEnd(touch.clientX);
    });

    btnLeft.addEventListener('click', () => applyDecision('left'));
    btnRight.addEventListener('click', () => applyDecision('right'));

    function showResult() {
      playTone('victory');
      const E_or_I = scores.EI >= 50 ? 'I' : 'E';
      const S_or_N = scores.SN >= 50 ? 'N' : 'S';
      const T_or_F = scores.TF >= 50 ? 'F' : 'T';
      const J_or_P = scores.JP >= 50 ? 'P' : 'J';

      const type = `${E_or_I}${S_or_N}${T_or_F}${J_or_P}`;
      const result = PERSONALITIES[type] || PERSONALITIES["INTJ"];

      document.getElementById('result-type').textContent = type;
      document.getElementById('result-title').textContent = result.title;
      document.getElementById('result-quote').textContent = result.quote;
      document.getElementById('result-icon').innerHTML = result.icon;

      document.getElementById('res-ei').textContent = `${E_or_I} (${E_or_I === 'I' ? scores.EI : 100 - scores.EI}%)`;
      document.getElementById('res-sn').textContent = `${S_or_N} (${S_or_N === 'N' ? scores.SN : 100 - scores.SN}%)`;
      document.getElementById('res-tf').textContent = `${T_or_F} (${T_or_F === 'F' ? scores.TF : 100 - scores.TF}%)`;
      document.getElementById('res-jp').textContent = `${J_or_P} (${J_or_P === 'P' ? scores.JP : 100 - scores.JP}%)`;

      const modal = document.getElementById('result-modal');
      modal.classList.remove('pointer-events-none');
      modal.classList.add('opacity-100');
    }

    document.getElementById('btn-restart').addEventListener('click', () => {
      currentIndex = 0;
      scores = { EI: 50, SN: 50, TF: 50, JP: 50 };
      updateMeters();
      renderCard();
      const modal = document.getElementById('result-modal');
      modal.classList.add('pointer-events-none');
      modal.classList.remove('opacity-100');
    });

    updateMeters();
    renderCard();
  </script>
</body>
</html>
