<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MBTI 王权：人格之骰</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800;900&family=Noto+Serif+SC:wght@500;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #08090d;
      --gold-main: #d4af37;
      --gold-light: #f6e05e;
      --gold-dark: #8c6d1f;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: #e2e8f0;
      font-family: 'Noto Serif SC', serif;
      height: 100vh;
      height: 100dvh;
    }
    .font-cinzel {
      font-family: 'Cinzel', serif;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Ambient Background Texture & Glow */
    .bg-vignette {
      background: radial-gradient(circle at 50% 35%, #181926 0%, #0c0d14 60%, #06070a 100%);
    }
    .bg-noise {
      background-image: radial-gradient(rgba(212, 175, 55, 0.08) 1px, transparent 0);
      background-size: 24px 24px;
    }

    /* Gold Ornate Borders & Frames */
    .reigns-frame {
      border: 1px solid rgba(212, 175, 55, 0.3);
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8), inset 0 0 12px rgba(212, 175, 55, 0.08);
      position: relative;
    }
    .reigns-frame::after {
      content: '';
      position: absolute;
      inset: 2px;
      border: 1px solid rgba(212, 175, 55, 0.15);
      pointer-events: none;
      border-radius: inherit;
    }
    .corner-decor {
      position: absolute;
      width: 10px;
      height: 10px;
      border-color: #d4af37;
      pointer-events: none;
    }
    .corner-tl { top: 3px; left: 3px; border-top: 2px solid; border-left: 2px solid; }
    .corner-tr { top: 3px; right: 3px; border-top: 2px solid; border-right: 2px solid; }
    .corner-bl { bottom: 3px; left: 3px; border-bottom: 2px solid; border-left: 2px solid; }
    .corner-br { bottom: 3px; right: 3px; border-bottom: 2px solid; border-right: 2px solid; }

    /* Card Physics Container */
    .card-stage {
      perspective: 1200px;
    }
    .game-card {
      transform-style: preserve-3d;
      will-change: transform, opacity;
      cursor: grab;
      touch-action: none;
    }
    .game-card:active {
      cursor: grabbing;
    }

    /* Meter Pointers & Pulsing Indicators */
    .meter-circle {
      position: relative;
      background: radial-gradient(circle, #1e1b2e 0%, #0f1016 100%);
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.8), 0 0 10px rgba(0,0,0,0.5);
    }
    .pulse-dot {
      animation: pulse-glow 1.2s infinite ease-in-out;
    }
    @keyframes pulse-glow {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.35); opacity: 1; filter: drop-shadow(0 0 6px #f6e05e); }
    }

    /* Stamp Animations */
    .choice-stamp {
      position: absolute;
      top: 20px;
      padding: 6px 14px;
      font-family: 'Cinzel', 'Noto Serif SC', serif;
      font-weight: 900;
      font-size: 1.1rem;
      letter-spacing: 0.1em;
      border-radius: 6px;
      text-transform: uppercase;
      border: 3px solid;
      pointer-events: none;
      z-index: 30;
      opacity: 0;
      transition: opacity 0.15s ease, transform 0.15s ease;
    }
    .stamp-left {
      right: 16px;
      transform: rotate(12deg) scale(0.9);
      color: #f87171;
      border-color: #f87171;
      background: rgba(15, 23, 42, 0.85);
      box-shadow: 0 0 15px rgba(248, 113, 113, 0.4);
    }
    .stamp-right {
      left: 16px;
      transform: rotate(-12deg) scale(0.9);
      color: #34d399;
      border-color: #34d399;
      background: rgba(15, 23, 42, 0.85);
      box-shadow: 0 0 15px rgba(52, 211, 153, 0.4);
    }
  </style>
</head>
<body class="bg-vignette bg-noise flex flex-col justify-between items-center px-4 py-3 select-none">

  <!-- ==================== TOP REIGNS METERS ==================== -->
  <header class="w-full max-w-sm flex flex-col items-center gap-2 pt-1 z-10">
    <!-- Header Title & Card Count -->
    <div class="w-full flex justify-between items-center px-1">
      <div class="flex items-center gap-1.5">

          <path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5m14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/>
        </svg>
        <span class="font-cinzel text-xs tracking-widest text-amber-300 font-extrabold">MBTI REIGNS</span>

      <div class="flex items-center gap-1 reigns-frame bg-slate-950/80 px-2.5 py-0.5 rounded-full">

          <svg viewBox="0 0 24 24" class="w-6 h-6 text-amber-200 relative z-10 drop-shadow" fill="none" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3" />

  <!-- ==================== CENTER STAGE & CARD ==================== -->

    <!-- The Reigns Card Stack -->

      <!-- Personality Breakdown Radar-like Bars -->

  <!-- ==================== JAVASCRIPT LOGIC ==================== -->
  <script>
    // Audio Synthesizer (Atmospheric Medieval/Arcade Tones)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (type === 'swipe') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, now);
        osc.frequency.exponentialRampToValueAtTime(50, now + 0.12);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start();
        osc.stop(now + 0.12);
      } else if (type === 'decision') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(260, now);
        osc.frequency.exponentialRampToValueAtTime(440, now + 0.18);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
        osc.start();
        osc.stop(now + 0.18);
      } else if (type === 'victory') {
        // Royal fanfare triad
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.type = 'triangle';
          o.frequency.setValueAtTime(freq, now + i * 0.08);
          g.gain.setValueAtTime(0.08, now + i * 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.08 + 0.4);
          o.start(now + i * 0.08);
          o.stop(now + i * 0.08 + 0.4);
        });
      }
    }

    // Handcrafted Reigns-style Minimalist Vector Avatars

      cardAvatar.innerHTML = item.avatar;
      cardText.textContent = item.text;
      progressEl.textContent = `${index + 1}/${deck.length}`;

      stampLeft.textContent = item.left.stamp;
      stampRight.textContent = item.right.stamp;
      hintLeft.textContent = item.left.hint;
      hintRight.textContent = item.right.hint;

      // Reset transforms
      activeCard.style.transform = `translate3d(0, 0, 0) rotate(0deg)`;
      activeCard.style.opacity = '1';
      choicePreviewBox.style.opacity = '0';
      stampLeft.style.opacity = '0';
      stampRight.style.opacity = '0';
      hideIndicators();
    }

    function updateMeters() {
      meterEI.style.height = `${scores.EI}%`;
      meterSN.style.height = `${scores.SN}%`;
      meterTF.style.height = `${scores.TF}%`;
      meterJP.style.height = `${scores.JP}%`;
    }

    function showIndicators(effects) {
      hideIndicators();
      if (!effects) return;
      Object.keys(effects).forEach(key => {
        const dot = document.getElementById(`dot-${key}`);
        if (dot) dot.style.opacity = '1';

        const val = effects[key];
        if (key === 'EI') {
          if (val > 0) labelI.className = "text-amber-300 font-black scale-125 transition-transform";
          else labelE.className = "text-amber-300 font-black scale-125 transition-transform";
        } else if (key === 'SN') {
          if (val > 0) labelN.className = "text-amber-300 font-black scale-125 transition-transform";
          else labelS.className = "text-amber-300 font-black scale-125 transition-transform";
        } else if (key === 'TF') {
          if (val > 0) labelF.className = "text-amber-300 font-black scale-125 transition-transform";
          else labelT.className = "text-amber-300 font-black scale-125 transition-transform";
        } else if (key === 'JP') {
          if (val > 0) labelP.className = "text-amber-300 font-black scale-125 transition-transform";
          else labelJ.className = "text-amber-300 font-black scale-125 transition-transform";
        }
      });
    }

    function hideIndicators() {
      [dotEI, dotSN, dotTF, dotJP].forEach(d => d.style.opacity = '0');
      labelE.className = labelI.className = "font-bold transition-all";
      labelS.className = labelN.className = "font-bold transition-all";
      labelT.className = labelF.className = "font-bold transition-all";
      labelJ.className = labelP.className = "font-bold transition-all";
    }

    // Touch & Mouse Drag Handlers
    function onStart(e) {
      isDragging = true;
      const point = e.touches ? e.touches[0] : e;
      startX = point.clientX;
      startY = point.clientY;
      activeCard.style.transition = 'none';
    }

    function onMove(e) {
      if (!isDragging) return;
      const point = e.touches ? e.touches[0] : e;
      currentX = point.clientX - startX;
      currentY = point.clientY - startY;

      const rotation = currentX * 0.08;
      activeCard.style.transform = `translate3d(${currentX}px, ${currentY}px, 0) rotate(${rotation}deg)`;

      // Scale background card on drag
      const progress = Math.min(1, Math.abs(currentX) / threshold);
      underCard.style.transform = `scale(${0.94 + progress * 0.06}) translateY(${10 - progress * 10}px)`;

      const card = deck[currentCardIndex];
      if (currentX < -20) {
        // Dragging Left
        choicePreviewText.textContent = card.left.text;
        choicePreviewBox.style.opacity = '1';
        choicePreviewBox.style.transform = 'scale(1)';
        stampLeft.style.opacity = Math.min(1, Math.abs(currentX) / 60);
        stampRight.style.opacity = '0';
        showIndicators(card.left.effects);
      } else if (currentX > 20) {
        // Dragging Right
        choicePreviewText.textContent = card.right.text;
        choicePreviewBox.style.opacity = '1';
        choicePreviewBox.style.transform = 'scale(1)';
        stampRight.style.opacity = Math.min(1, currentX / 60);
        stampLeft.style.opacity = '0';
        showIndicators(card.right.effects);
      } else {
        choicePreviewBox.style.opacity = '0';
        choicePreviewBox.style.transform = 'scale(0.95)';
        stampLeft.style.opacity = '0';
        stampRight.style.opacity = '0';
        hideIndicators();
      }
    }

    function onEnd() {
      if (!isDragging) return;
      isDragging = false;
      activeCard.style.transition = 'transform 0.25s ease-out, opacity 0.25s';

      if (currentX < -threshold) {
        commitDecision('left');
      } else if (currentX > threshold) {
        commitDecision('right');
      } else {
        // Snap back
        activeCard.style.transform = `translate3d(0, 0, 0) rotate(0deg)`;
        underCard.style.transform = `scale(0.94) translateY(10px)`;
        choicePreviewBox.style.opacity = '0';
        stampLeft.style.opacity = '0';
        stampRight.style.opacity = '0';
        hideIndicators();
      }
    }

    function commitDecision(dir) {
      playSound('decision');
      const card = deck[currentCardIndex];
      const choice = dir === 'left' ? card.left : card.right;

      Object.keys(choice.effects).forEach(k => {
        scores[k] = Math.max(5, Math.min(95, scores[k] + choice.effects[k]));
      });
      updateMeters();

      const flyX = dir === 'left' ? -450 : 450;
      activeCard.style.transform = `translate3d(${flyX}px, ${currentY}px, 0) rotate(${flyX * 0.05}deg)`;
      activeCard.style.opacity = '0';

      setTimeout(() => {
        currentCardIndex++;
        loadCard(currentCardIndex);
      }, 200);
    }

    // Attach Gestures
    activeCard.addEventListener('mousedown', onStart);
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onEnd);

    activeCard.addEventListener('touchstart', onStart, { passive: true });
    document.addEventListener('touchmove', onMove, { passive: true });
    document.addEventListener('touchend', onEnd);

    // Results Display
    function showResults() {
      playSound('victory');

      const E_or_I = scores.EI >= 50 ? 'I' : 'E';
      const S_or_N = scores.SN >= 50 ? 'N' : 'S';
      const T_or_F = scores.TF >= 50 ? 'F' : 'T';
      const J_or_P = scores.JP >= 50 ? 'P' : 'J';

      const type = `${E_or_I}${S_or_N}${T_or_F}${J_or_P}`;
      const result = personalities[type] || personalities["INTJ"];

      document.getElementById('result-type').textContent = type;
      document.getElementById('result-title').textContent = result.title;
      document.getElementById('result-desc').textContent = result.desc;

      // Stats
      document.getElementById('res-val-E').textContent = `E ${Math.round(100 - scores.EI)}%`;
      document.getElementById('res-val-I').textContent = `I ${Math.round(scores.EI)}%`;
      document.getElementById('res-bar-EI').style.width = `${scores.EI}%`;

      document.getElementById('res-val-S').textContent = `S ${Math.round(100 - scores.SN)}%`;
      document.getElementById('res-val-N').textContent = `N ${Math.round(scores.SN)}%`;
      document.getElementById('res-bar-SN').style.width = `${scores.SN}%`;

      document.getElementById('res-val-T').textContent = `T ${Math.round(100 - scores.TF)}%`;
      document.getElementById('res-val-F').textContent = `F ${Math.round(scores.TF)}%`;
      document.getElementById('res-bar-TF').style.width = `${scores.TF}%`;

      document.getElementById('res-val-J').textContent = `J ${Math.round(100 - scores.JP)}%`;
      document.getElementById('res-val-P').textContent = `P ${Math.round(scores.JP)}%`;
      document.getElementById('res-bar-JP').style.width = `${scores.JP}%`;

      // Draw Royal Crest
      document.getElementById('result-badge').innerHTML = `
        <svg viewBox="0 0 100 100" class="w-16 h-16 text-amber-300 drop-shadow-[0_0_8px_rgba(212,175,55,0.6)]" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="50,6 90,24 90,76 50,94 10,76 10,24" stroke-linejoin="round"/>
          <circle cx="50" cy="50" r="28" stroke-dasharray="3,3" stroke-width="1"/>
          <text x="50" y="55" font-family="'Cinzel', serif" font-weight="900" font-size="14" fill="#f6e05e" text-anchor="middle">${type}</text>
        </svg>
      `;

      document.getElementById('results-modal').classList.remove('hidden');
    }

    // Restart & Share
    document.getElementById('btn-restart').addEventListener('click', () => {
      playSound('swipe');
      currentCardIndex = 0;
      scores = { EI: 50, SN: 50, TF: 50, JP: 50 };
      updateMeters();
      document.getElementById('results-modal').classList.add('hidden');
      loadCard(0);
    });

    document.getElementById('btn-share').addEventListener('click', () => {
      playSound('decision');
      const E_or_I = scores.EI >= 50 ? 'I' : 'E';
      const S_or_N = scores.SN >= 50 ? 'N' : 'S';
      const T_or_F = scores.TF >= 50 ? 'F' : 'T';
      const J_or_P = scores.JP >= 50 ? 'P' : 'J';
      const type = `${E_or_I}${S_or_N}${T_or_F}${J_or_P}`;
      const result = personalities[type];

      const text = `👑 我在《MBTI 王权：人格之骰》中加冕为【${type} - ${result.title}】！\n\n“${result.desc}”\n滑动卡牌，探寻你的命定人格！`;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          alert('加冕诏书已复制到剪贴板，快去昭告天下！');
        });
      } else {
        alert(text);
      }
    });

    // Boot
    updateMeters();
    loadCard(0);
  </script>
</body>
</html>
